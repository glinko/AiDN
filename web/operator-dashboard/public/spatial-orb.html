<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#edf2f6" />
    <title>AiDN Spatial Orb</title>
    <style>
      :root {
        color-scheme: light;
        background: #edf2f6;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background:
          radial-gradient(circle at 28% 21%, rgba(194, 219, 239, 0.58), transparent 31%),
          radial-gradient(circle at 76% 34%, rgba(214, 204, 239, 0.4), transparent 34%),
          linear-gradient(180deg, #fbfdff 0%, #f3f7fa 72%, #e7edf2 100%);
      }

      canvas {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: block;
        width: 100%;
        height: 100%;
      }

      .fallback-orb {
        position: fixed;
        top: 33.333%;
        left: 50%;
        width: min(40vmin, 24rem);
        aspect-ratio: 1;
        z-index: 0;
        border: 1px solid rgba(125, 146, 159, 0.2);
        border-radius: 50%;
        background:
          radial-gradient(circle at 31% 25%, rgba(255, 255, 255, 0.98) 0 5%, transparent 17%),
          radial-gradient(circle at 68% 67%, rgba(198, 185, 235, 0.36), transparent 48%),
          radial-gradient(circle at 28% 73%, rgba(151, 211, 219, 0.3), transparent 43%),
          radial-gradient(circle at 38% 30%, #fbfdfe 0%, #e9eef2 55%, #bdc8cf 100%);
        box-shadow:
          inset -1rem -1.2rem 2.4rem rgba(101, 123, 137, 0.22),
          inset 0.8rem 0.8rem 2rem rgba(255, 255, 255, 0.9),
          0 2.2rem 2.8rem -2rem rgba(66, 82, 94, 0.42);
        transform: translate(-50%, -50%);
        transition: opacity 180ms ease;
      }

      body.is-rendered .fallback-orb {
        opacity: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .fallback-orb {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- impeccable:direction-contract
    THESIS: A single quiet milky-glass orb makes AiDN feel spatial before any interface appears.
    OWN-WORLD: The established high-key Spatial palette, cool spectral reflections, atmospheric horizon, and soft optical depth.
    STORY: Pale environment first, elevated orb second, four sharp faceted cubes third, then the lowered ground and long penumbral shadows.
    FIRST VIEWPORT: One upper-third sphere with four smaller hard-edged cubes to its right; no chrome, text, particles, orbit, or controls.
    FORM: Pinned reference composition; seed key: user-pinned-spatial-orb-v1.
    FINISH: Canvas 2D, responsive high-DPI rendering, fixed top-left-front cube lighting, continuous specular travel, independent cube drift and vertical-axis yaw, reduced-motion support, and a CSS fallback.
    -->
    <div class="fallback-orb" aria-hidden="true"></div>
    <canvas
      id="spatial-orb"
      role="img"
      aria-label="A translucent milky glass sphere and four softly colored cubes floating over a low iridescent ground."
    ></canvas>

    <script>
      (() => {
        "use strict";

        const canvas = document.querySelector("#spatial-orb");
        const context = canvas.getContext("2d", { alpha: false });

        if (!context) return;

        const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
        let reducedMotion = motionQuery.matches;
        let viewportWidth = 0;
        let viewportHeight = 0;
        let animationFrame = 0;
        let lastPaint = -Infinity;

        const clamp = (value, minimum, maximum) => Math.min(maximum, Math.max(minimum, value));
        const fullTurn = Math.PI * 2;
        // Scene-space vectors stay fixed while each cube turns beneath them.
        const cubeLightDirection = { x: -0.55, y: -0.72, z: 0.42 };
        const cubeHalfDirection = { x: -0.313, y: -0.513, z: 0.8 };
        const cubeHighlightTone = { r: 255, g: 255, b: 255 };
        const cubeShadowTone = { r: 58, g: 70, b: 82 };
        const randomBetween = (minimum, maximum) => minimum + Math.random() * (maximum - minimum);
        const wanderProfile = {
          x: [
            { weight: 1, period: randomBetween(18000, 26000), phase: randomBetween(0, fullTurn) },
            { weight: 0.62, period: randomBetween(33000, 47000), phase: randomBetween(0, fullTurn) },
            { weight: 0.38, period: randomBetween(52000, 71000), phase: randomBetween(0, fullTurn) },
          ],
          y: [
            { weight: 1, period: randomBetween(21000, 29000), phase: randomBetween(0, fullTurn) },
            { weight: 0.62, period: randomBetween(37000, 51000), phase: randomBetween(0, fullTurn) },
            { weight: 0.38, period: randomBetween(57000, 78000), phase: randomBetween(0, fullTurn) },
          ],
        };
        const cubeLayout = [
          {
            x: 1.5,
            y: -0.78,
            size: 0.62,
            yaw: -0.32,
            colors: {
              frontStart: "#ebe9fb",
              frontEnd: "#9892cc",
              topStart: "#faf9ff",
              topEnd: "#c8c2ea",
              sideStart: "#aaa3d6",
              sideEnd: "#7671a5",
              shadow: "rgba(83, 77, 124, 0.2)",
            },
          },
          {
            x: 1.88,
            y: -0.1,
            size: 0.48,
            yaw: -0.26,
            colors: {
              frontStart: "#f6e8df",
              frontEnd: "#bd8f7d",
              topStart: "#fffaf6",
              topEnd: "#dfbfae",
              sideStart: "#cca08d",
              sideEnd: "#966b5b",
              shadow: "rgba(119, 77, 62, 0.18)",
            },
          },
          {
            x: 1.55,
            y: 0.55,
            size: 0.56,
            yaw: -0.3,
            colors: {
              frontStart: "#e2f5f8",
              frontEnd: "#76aec0",
              topStart: "#f7feff",
              topEnd: "#b5dce5",
              sideStart: "#8ebdca",
              sideEnd: "#568a9c",
              shadow: "rgba(54, 99, 114, 0.18)",
            },
          },
          {
            x: 1.92,
            y: 1.2,
            size: 0.43,
            yaw: -0.24,
            colors: {
              frontStart: "#e4f0e9",
              frontEnd: "#83ad9c",
              topStart: "#f8fcfa",
              topEnd: "#bdd6ca",
              sideStart: "#96b9aa",
              sideEnd: "#648d7c",
              shadow: "rgba(53, 91, 75, 0.17)",
            },
          },
        ];
        const cubeMotionProfiles = cubeLayout.map((_, index) => ({
          x: [
            { weight: 1, period: randomBetween(28000, 44000), phase: randomBetween(0, fullTurn) },
            { weight: 0.6, period: randomBetween(50000, 70000), phase: randomBetween(0, fullTurn) },
            { weight: 0.34, period: randomBetween(80000, 110000), phase: randomBetween(0, fullTurn) },
          ],
          y: [
            { weight: 1, period: randomBetween(32000, 48000), phase: randomBetween(0, fullTurn) },
            { weight: 0.6, period: randomBetween(56000, 76000), phase: randomBetween(0, fullTurn) },
            { weight: 0.34, period: randomBetween(88000, 118000), phase: randomBetween(0, fullTurn) },
          ],
          yawDirection: index % 2 === 0 ? 1 : -1,
          yawOffset: randomBetween(-0.075, 0.075),
          yawPeriod: randomBetween(190000, 310000),
          wobbleAmplitude: randomBetween(0.025, 0.055),
          wobblePeriod: randomBetween(45000, 75000),
          wobblePhase: randomBetween(0, fullTurn),
        }));

        function sampleWanderAxis(waves, time) {
          let weightedPosition = 0;
          let totalWeight = 0;

          for (const wave of waves) {
            weightedPosition += Math.sin((time / wave.period) * fullTurn + wave.phase) * wave.weight;
            totalWeight += wave.weight;
          }

          return weightedPosition / totalWeight;
        }

        function getWanderOffset(time, radius) {
          if (reducedMotion) return { x: 0, y: 0 };

          // Each axis stays within 17.4% of the radius, keeping the diagonal
          // travel envelope just under one quarter of the sphere radius.
          const axisSpan = radius * 0.174;
          return {
            x: sampleWanderAxis(wanderProfile.x, time) * axisSpan,
            y: sampleWanderAxis(wanderProfile.y, time) * axisSpan,
          };
        }

        function getCubeMotion(index, time, size, baseYaw) {
          if (reducedMotion) {
            return { x: 0, y: 0, yaw: baseYaw };
          }

          const profile = cubeMotionProfiles[index];
          const axisSpan = size * 0.174;
          return {
            x: sampleWanderAxis(profile.x, time) * axisSpan,
            y: sampleWanderAxis(profile.y, time) * axisSpan,
            yaw:
              baseYaw +
              profile.yawOffset +
              (time / profile.yawPeriod) * fullTurn * profile.yawDirection +
              Math.sin((time / profile.wobblePeriod) * fullTurn + profile.wobblePhase) *
                profile.wobbleAmplitude,
          };
        }

        function fillRadialGlow(x, y, radius, innerColor, outerColor = "rgba(255,255,255,0)") {
          const gradient = context.createRadialGradient(x, y, 0, x, y, radius);
          gradient.addColorStop(0, innerColor);
          gradient.addColorStop(1, outerColor);
          context.fillStyle = gradient;
          context.fillRect(x - radius, y - radius, radius * 2, radius * 2);
        }

        function drawBackground(time) {
          const width = viewportWidth;
          const height = viewportHeight;
          const drift = reducedMotion ? 0 : Math.sin(time * 0.00014);
          const counterDrift = reducedMotion ? 0 : Math.cos(time * 0.00011);

          const sky = context.createLinearGradient(0, 0, 0, height);
          sky.addColorStop(0, "#fcfdff");
          sky.addColorStop(0.34, "#f7fafc");
          sky.addColorStop(0.58, "#eef3f7");
          sky.addColorStop(1, "#e5ebf0");
          context.fillStyle = sky;
          context.fillRect(0, 0, width, height);

          context.save();
          context.globalCompositeOperation = "source-over";
          fillRadialGlow(
            width * (0.26 + drift * 0.012),
            height * (0.22 + counterDrift * 0.008),
            Math.max(width, height) * 0.48,
            "rgba(159, 204, 235, 0.28)"
          );
          fillRadialGlow(
            width * (0.78 - drift * 0.01),
            height * (0.3 + drift * 0.006),
            Math.max(width, height) * 0.44,
            "rgba(199, 185, 235, 0.22)"
          );
          fillRadialGlow(
            width * 0.54,
            height * (0.76 + counterDrift * 0.008),
            Math.max(width, height) * 0.42,
            "rgba(162, 218, 215, 0.13)"
          );
          fillRadialGlow(
            width * (0.65 + counterDrift * 0.008),
            height * 0.72,
            Math.max(width, height) * 0.3,
            "rgba(238, 207, 188, 0.12)"
          );
          context.restore();

          const horizon = height * 0.75;
          const ground = context.createLinearGradient(0, horizon, 0, height);
          ground.addColorStop(0, "rgba(204, 219, 231, 0.52)");
          ground.addColorStop(0.09, "rgba(224, 232, 239, 0.66)");
          ground.addColorStop(1, "rgba(216, 226, 234, 0.82)");
          context.fillStyle = ground;
          context.beginPath();
          context.moveTo(0, horizon + height * 0.018);
          context.bezierCurveTo(
            width * 0.29,
            horizon - height * 0.025,
            width * 0.68,
            horizon - height * 0.012,
            width,
            horizon + height * 0.008
          );
          context.lineTo(width, height);
          context.lineTo(0, height);
          context.closePath();
          context.fill();

          const haze = context.createLinearGradient(0, horizon - height * 0.05, 0, horizon + height * 0.11);
          haze.addColorStop(0, "rgba(255,255,255,0)");
          haze.addColorStop(0.48, "rgba(255,255,255,0.28)");
          haze.addColorStop(1, "rgba(255,255,255,0)");
          context.fillStyle = haze;
          context.fillRect(0, horizon - height * 0.05, width, height * 0.16);

          const vignette = context.createRadialGradient(
            width * 0.5,
            height * 0.45,
            Math.min(width, height) * 0.24,
            width * 0.5,
            height * 0.48,
            Math.max(width, height) * 0.77
          );
          vignette.addColorStop(0, "rgba(255,255,255,0)");
          vignette.addColorStop(0.76, "rgba(178,195,206,0.025)");
          vignette.addColorStop(1, "rgba(126,149,165,0.095)");
          context.fillStyle = vignette;
          context.fillRect(0, 0, width, height);
        }

        function drawShadow(centerX, centerY, radius, time) {
          const drift = reducedMotion ? 0 : Math.sin(time * 0.00016);
          const shadowY = centerY + radius * 0.94;

          context.save();
          context.translate(centerX + radius * (0.08 + drift * 0.012), shadowY);
          context.scale(1.1, 0.24);
          const broadShadow = context.createRadialGradient(0, 0, radius * 0.08, 0, 0, radius * 1.45);
          broadShadow.addColorStop(0, "rgba(64, 80, 91, 0.18)");
          broadShadow.addColorStop(0.36, "rgba(83, 101, 113, 0.1)");
          broadShadow.addColorStop(0.72, "rgba(104, 125, 139, 0.035)");
          broadShadow.addColorStop(1, "rgba(104, 125, 139, 0)");
          context.fillStyle = broadShadow;
          context.beginPath();
          context.arc(0, 0, radius * 1.45, 0, Math.PI * 2);
          context.fill();
          context.restore();

          context.save();
          context.translate(centerX - radius * 0.2, shadowY - radius * 0.025);
          context.scale(1, 0.13);
          const contactShadow = context.createRadialGradient(0, 0, 0, 0, 0, radius * 0.82);
          contactShadow.addColorStop(0, "rgba(43, 59, 69, 0.14)");
          contactShadow.addColorStop(0.52, "rgba(76, 94, 106, 0.06)");
          contactShadow.addColorStop(1, "rgba(76, 94, 106, 0)");
          context.fillStyle = contactShadow;
          context.beginPath();
          context.arc(0, 0, radius * 0.82, 0, Math.PI * 2);
          context.fill();
          context.restore();

          context.save();
          context.globalCompositeOperation = "source-over";
          context.translate(centerX - radius * 0.46, shadowY + radius * 0.055);
          context.scale(1, 0.16);
          const reflectedLight = context.createRadialGradient(0, 0, 0, 0, 0, radius * 0.82);
          reflectedLight.addColorStop(0, "rgba(149, 211, 222, 0.19)");
          reflectedLight.addColorStop(0.5, "rgba(175, 192, 235, 0.09)");
          reflectedLight.addColorStop(1, "rgba(255,255,255,0)");
          context.fillStyle = reflectedLight;
          context.beginPath();
          context.arc(0, 0, radius * 0.82, 0, Math.PI * 2);
          context.fill();
          context.restore();
        }

        function traceFacet(points) {
          context.moveTo(points[0].x, points[0].y);
          for (let index = 1; index < points.length; index += 1) {
            context.lineTo(points[index].x, points[index].y);
          }
          context.closePath();
        }

        function drawFacet(points, fillStyle, edgeWidth) {
          context.beginPath();
          traceFacet(points);
          context.fillStyle = fillStyle;
          context.fill();
          context.lineJoin = "miter";
          context.miterLimit = 4;
          context.lineWidth = edgeWidth;
          context.strokeStyle = fillStyle;
          context.stroke();
        }

        function getFacetBounds(points) {
          const xPositions = points.map((point) => point.x);
          const yPositions = points.map((point) => point.y);
          return {
            left: Math.min(...xPositions),
            right: Math.max(...xPositions),
            top: Math.min(...yPositions),
            bottom: Math.max(...yPositions),
          };
        }

        function dotVector(vectorA, vectorB) {
          return vectorA.x * vectorB.x + vectorA.y * vectorB.y + vectorA.z * vectorB.z;
        }

        function parseHexColor(color) {
          const numericColor = Number.parseInt(color.slice(1), 16);
          return {
            r: (numericColor >> 16) & 255,
            g: (numericColor >> 8) & 255,
            b: numericColor & 255,
          };
        }

        function mixRgb(colorA, colorB, amount) {
          const mixAmount = clamp(amount, 0, 1);
          return {
            r: colorA.r + (colorB.r - colorA.r) * mixAmount,
            g: colorA.g + (colorB.g - colorA.g) * mixAmount,
            b: colorA.b + (colorB.b - colorA.b) * mixAmount,
          };
        }

        function rgbColor(color) {
          return `rgb(${Math.round(color.r)}, ${Math.round(color.g)}, ${Math.round(color.b)})`;
        }

        function getCubeFaceLighting(normal, facing = 1) {
          const diffuse = Math.max(0, dotVector(normal, cubeLightDirection));
          const edgeVisibility = clamp((facing - 0.018) / 0.16, 0, 1);
          const specular =
            Math.pow(Math.max(0, dotVector(normal, cubeHalfDirection)), 10) * edgeVisibility;
          return {
            diffuse,
            brightness: 0.34 + diffuse * 0.66,
            specular,
          };
        }

        function getLitFaceColors(baseColor, lighting) {
          const neutralBrightness = 0.62;
          const balancedColor =
            lighting.brightness >= neutralBrightness
              ? mixRgb(
                  baseColor,
                  cubeHighlightTone,
                  (lighting.brightness - neutralBrightness) * 0.62
                )
              : mixRgb(
                  baseColor,
                  cubeShadowTone,
                  (neutralBrightness - lighting.brightness) * 0.72
                );
          return {
            start: mixRgb(
              balancedColor,
              cubeHighlightTone,
              0.2 + lighting.diffuse * 0.12
            ),
            middle: balancedColor,
            end: mixRgb(
              balancedColor,
              cubeShadowTone,
              0.12 + (1 - lighting.diffuse) * 0.08
            ),
          };
        }

        function projectCubeVertex(x, y, z, yaw, depthTilt) {
          const cosine = Math.cos(yaw);
          const sine = Math.sin(yaw);
          const rotatedX = x * cosine + z * sine;
          const rotatedZ = -x * sine + z * cosine;
          return {
            x: rotatedX,
            y: y + rotatedZ * depthTilt,
            z: rotatedZ,
          };
        }

        function drawCube(centerX, centerY, size, colors, yaw) {
          const half = size * 0.39;
          const depthTilt = 0.18;
          const cosine = Math.cos(yaw);
          const sine = Math.sin(yaw);
          const vertex = (x, y, z) => projectCubeVertex(x, y, z, yaw, depthTilt);
          const faces = {
            top: [
              vertex(-half, -half, -half),
              vertex(half, -half, -half),
              vertex(half, -half, half),
              vertex(-half, -half, half),
            ],
            front: [
              vertex(-half, -half, half),
              vertex(half, -half, half),
              vertex(half, half, half),
              vertex(-half, half, half),
            ],
            back: [
              vertex(half, -half, -half),
              vertex(-half, -half, -half),
              vertex(-half, half, -half),
              vertex(half, half, -half),
            ],
            left: [
              vertex(-half, -half, -half),
              vertex(-half, -half, half),
              vertex(-half, half, half),
              vertex(-half, half, -half),
            ],
            right: [
              vertex(half, -half, half),
              vertex(half, -half, -half),
              vertex(half, half, -half),
              vertex(half, half, half),
            ],
          };
          const verticalFaces = [];

          if (Math.abs(cosine) > 0.018) {
            verticalFaces.push({
              kind: cosine >= 0 ? "front" : "back",
              points: cosine >= 0 ? faces.front : faces.back,
              facing: Math.abs(cosine),
              normal:
                cosine >= 0
                  ? { x: sine, y: 0, z: cosine }
                  : { x: -sine, y: 0, z: -cosine },
            });
          }
          if (Math.abs(sine) > 0.018) {
            verticalFaces.push({
              kind: sine >= 0 ? "left" : "right",
              points: sine >= 0 ? faces.left : faces.right,
              facing: Math.abs(sine),
              normal:
                sine >= 0
                  ? { x: -cosine, y: 0, z: sine }
                  : { x: cosine, y: 0, z: -sine },
            });
          }
          for (const face of verticalFaces) {
            face.depth =
              face.points.reduce((depth, point) => depth + point.z, 0) /
              face.points.length;
          }
          verticalFaces.sort(
            (faceA, faceB) =>
              faceA.depth - faceB.depth || faceA.kind.localeCompare(faceB.kind)
          );
          const visibleFaces = [
            {
              kind: "top",
              points: faces.top,
              facing: 1,
              normal: { x: 0, y: -1, z: 0 },
            },
            ...verticalFaces,
          ];

          const localHalfDirection = {
            x: cubeHalfDirection.x * cosine - cubeHalfDirection.z * sine,
            y: cubeHalfDirection.y,
            z: cubeHalfDirection.x * sine + cubeHalfDirection.z * cosine,
          };
          const highlightTravel = half * 0.7;
          const highlightInset = half * 0.985;
          const highlightLocalX = clamp(
            localHalfDirection.x * highlightTravel,
            -half * 0.72,
            half * 0.72
          );
          const highlightLocalY = clamp(
            localHalfDirection.y * highlightTravel,
            -half * 0.72,
            half * 0.72
          );
          const highlightLocalZ = clamp(
            localHalfDirection.z * highlightTravel,
            -half * 0.72,
            half * 0.72
          );
          const getHighlightAnchor = (kind) => {
            if (kind === "top") {
              return vertex(highlightLocalX, -highlightInset, highlightLocalZ);
            }
            if (kind === "front") {
              return vertex(highlightLocalX, highlightLocalY, highlightInset);
            }
            if (kind === "back") {
              return vertex(highlightLocalX, highlightLocalY, -highlightInset);
            }
            if (kind === "left") {
              return vertex(-highlightInset, highlightLocalY, highlightLocalZ);
            }
            return vertex(highlightInset, highlightLocalY, highlightLocalZ);
          };
          for (const face of visibleFaces) {
            face.lighting = getCubeFaceLighting(face.normal, face.facing);
            face.highlightAnchor = getHighlightAnchor(face.kind);
          }

          context.save();
          context.translate(centerX, centerY);

          context.save();
          context.shadowColor = colors.shadow;
          context.shadowBlur = size * 0.3;
          context.shadowOffsetX = size * 0.06;
          context.shadowOffsetY = size * 0.14;
          context.fillStyle = colors.frontEnd;
          context.beginPath();
          for (const face of visibleFaces) traceFacet(face.points);
          context.fill();
          context.restore();

          const baseColor = mixRgb(
            parseHexColor(colors.frontStart),
            parseHexColor(colors.frontEnd),
            0.46
          );
          for (const face of visibleFaces) {
            const bounds = getFacetBounds(face.points);
            const litColors = getLitFaceColors(baseColor, face.lighting);
            const faceGradient = context.createLinearGradient(
              bounds.left,
              bounds.top,
              bounds.right,
              bounds.bottom
            );
            faceGradient.addColorStop(0, rgbColor(litColors.start));
            faceGradient.addColorStop(0.52, rgbColor(litColors.middle));
            faceGradient.addColorStop(1, rgbColor(litColors.end));
            drawFacet(face.points, faceGradient, Math.max(0.7, size * 0.012));
          }

          for (const face of visibleFaces) {
            const bounds = getFacetBounds(face.points);
            const width = bounds.right - bounds.left;
            const height = bounds.bottom - bounds.top;
            const { x: highlightX, y: highlightY } = face.highlightAnchor;
            const sheenOpacity =
              0.035 + face.lighting.diffuse * 0.055 + face.lighting.specular * 0.72;

            context.save();
            context.beginPath();
            traceFacet(face.points);
            context.clip();
            context.globalCompositeOperation = "screen";
            context.globalAlpha = clamp(sheenOpacity, 0, 0.72);
            const sheen = context.createRadialGradient(
              highlightX,
              highlightY,
              size * 0.015,
              highlightX,
              highlightY,
              size * 0.43
            );
            sheen.addColorStop(0, "rgba(255,255,255,0.98)");
            sheen.addColorStop(0.24, "rgba(255,255,255,0.5)");
            sheen.addColorStop(1, "rgba(255,255,255,0)");
            context.fillStyle = sheen;
            context.fillRect(bounds.left, bounds.top, width, height);

            const streakOpacity = clamp(face.lighting.specular * 1.35, 0, 0.78);
            if (streakOpacity > 0.012) {
              context.globalAlpha = streakOpacity;
              context.strokeStyle = "rgba(255,255,255,0.92)";
              context.lineCap = "round";
              context.lineWidth = Math.max(1.1, size * 0.035);
              context.beginPath();
              context.moveTo(highlightX - size * 0.075, highlightY + size * 0.018);
              context.lineTo(highlightX + size * 0.09, highlightY - size * 0.052);
              context.stroke();
            }
            context.restore();
          }

          for (const face of visibleFaces) {
            context.strokeStyle = `rgba(255,255,255,${0.12 + face.lighting.diffuse * 0.16})`;
            context.lineJoin = "miter";
            context.miterLimit = 4;
            context.lineWidth = Math.max(0.75, size * 0.012);
            context.beginPath();
            traceFacet(face.points);
            context.stroke();
          }

          context.restore();
        }

        function drawCubeCluster(baseCenterX, baseCenterY, radius, groundY, time) {
          const renderedCubes = cubeLayout.map((cube, index) => {
            const size = radius * cube.size;
            const motion = getCubeMotion(index, time, size, cube.yaw);
            const baseX = baseCenterX + radius * cube.x;
            const maximumDrift = size * 0.174;
            const maximumRotatedExtent = size * 0.59;
            const edgeShift = Math.max(
              0,
              baseX + maximumDrift + maximumRotatedExtent + 4 - viewportWidth
            );

            return {
              cube,
              size,
              motion,
              baseX: baseX - edgeShift,
              x: baseX - edgeShift + motion.x,
              y: baseCenterY + radius * cube.y + motion.y,
            };
          });

          for (const renderedCube of renderedCubes) {
            const { cube, size, motion, baseX } = renderedCube;
            const liftRatio = clamp(motion.y / (size * 0.174 || 1), -1, 1);
            const shadowScale = 1 - liftRatio * 0.055;

            context.save();
            context.globalAlpha = 0.42 + liftRatio * 0.055;
            context.translate(
              baseX + motion.x * 0.38 + size * 0.12,
              groundY + size * 0.08
            );
            context.scale(shadowScale, 0.19 * shadowScale);
            const shadow = context.createRadialGradient(0, 0, 0, 0, 0, size * 0.72);
            shadow.addColorStop(0, cube.colors.shadow);
            shadow.addColorStop(0.52, "rgba(75,92,102,0.065)");
            shadow.addColorStop(1, "rgba(75,92,102,0)");
            context.fillStyle = shadow;
            context.beginPath();
            context.arc(0, 0, size * 0.72, 0, fullTurn);
            context.fill();
            context.restore();
          }

          for (const renderedCube of renderedCubes) {
            const { cube, size, motion, x, y } = renderedCube;
            drawCube(
              x,
              y,
              size,
              cube.colors,
              motion.yaw
            );
          }
        }

        function drawOrb(centerX, centerY, radius, time) {
          const lightDrift = reducedMotion ? 0 : Math.sin(time * 0.00018);
          const lightCounterDrift = reducedMotion ? 0 : Math.cos(time * 0.00013);

          context.save();
          context.shadowColor = "rgba(87, 107, 120, 0.2)";
          context.shadowBlur = radius * 0.13;
          context.shadowOffsetY = radius * 0.045;
          context.fillStyle = "rgba(218, 227, 232, 0.84)";
          context.beginPath();
          context.arc(centerX, centerY, radius, 0, Math.PI * 2);
          context.fill();
          context.restore();

          context.save();
          context.beginPath();
          context.arc(centerX, centerY, radius - 0.7, 0, Math.PI * 2);
          context.clip();

          const glass = context.createRadialGradient(
            centerX - radius * 0.33,
            centerY - radius * 0.4,
            radius * 0.045,
            centerX + radius * 0.08,
            centerY + radius * 0.1,
            radius * 1.08
          );
          glass.addColorStop(0, "rgba(255,255,255,0.99)");
          glass.addColorStop(0.24, "rgba(250,252,253,0.97)");
          glass.addColorStop(0.57, "rgba(232,238,242,0.96)");
          glass.addColorStop(0.82, "rgba(211,221,227,0.96)");
          glass.addColorStop(1, "rgba(164,181,191,0.98)");
          context.fillStyle = glass;
          context.fillRect(centerX - radius, centerY - radius, radius * 2, radius * 2);

          context.globalCompositeOperation = "source-over";
          fillRadialGlow(
            centerX + radius * (0.45 + lightDrift * 0.08),
            centerY + radius * (0.18 + lightCounterDrift * 0.05),
            radius * 0.92,
            "rgba(180, 168, 232, 0.28)"
          );
          fillRadialGlow(
            centerX - radius * (0.5 - lightCounterDrift * 0.06),
            centerY + radius * (0.47 + lightDrift * 0.04),
            radius * 0.79,
            "rgba(112, 201, 214, 0.25)"
          );
          fillRadialGlow(
            centerX + radius * (0.24 + lightCounterDrift * 0.05),
            centerY + radius * 0.68,
            radius * 0.72,
            "rgba(238, 196, 173, 0.2)"
          );
          fillRadialGlow(
            centerX - radius * 0.36,
            centerY - radius * (0.37 + lightDrift * 0.025),
            radius * 0.62,
            "rgba(173, 213, 239, 0.17)"
          );

          context.globalCompositeOperation = "multiply";
          const innerShade = context.createRadialGradient(
            centerX - radius * 0.22,
            centerY - radius * 0.28,
            radius * 0.38,
            centerX,
            centerY,
            radius
          );
          innerShade.addColorStop(0, "rgba(255,255,255,0)");
          innerShade.addColorStop(0.66, "rgba(157,177,189,0.018)");
          innerShade.addColorStop(0.86, "rgba(91,115,130,0.08)");
          innerShade.addColorStop(1, "rgba(62,85,100,0.22)");
          context.fillStyle = innerShade;
          context.fillRect(centerX - radius, centerY - radius, radius * 2, radius * 2);

          const lowerRefraction = context.createLinearGradient(
            0,
            centerY + radius * 0.24,
            0,
            centerY + radius
          );
          lowerRefraction.addColorStop(0, "rgba(98,126,143,0)");
          lowerRefraction.addColorStop(0.62, "rgba(95,124,141,0.045)");
          lowerRefraction.addColorStop(1, "rgba(67,94,111,0.17)");
          context.fillStyle = lowerRefraction;
          context.fillRect(centerX - radius, centerY, radius * 2, radius);

          context.globalCompositeOperation = "screen";
          const bloom = context.createRadialGradient(
            centerX - radius * 0.4,
            centerY - radius * 0.47,
            0,
            centerX - radius * 0.4,
            centerY - radius * 0.47,
            radius * 0.61
          );
          bloom.addColorStop(0, "rgba(255,255,255,0.96)");
          bloom.addColorStop(0.18, "rgba(255,255,255,0.58)");
          bloom.addColorStop(0.56, "rgba(255,255,255,0.12)");
          bloom.addColorStop(1, "rgba(255,255,255,0)");
          context.fillStyle = bloom;
          context.fillRect(centerX - radius, centerY - radius, radius * 1.45, radius * 1.45);

          context.restore();

          context.save();
          context.lineWidth = Math.max(1, radius * 0.008);
          const rim = context.createLinearGradient(
            centerX - radius,
            centerY - radius,
            centerX + radius,
            centerY + radius
          );
          rim.addColorStop(0, "rgba(255,255,255,0.96)");
          rim.addColorStop(0.32, "rgba(234,242,247,0.7)");
          rim.addColorStop(0.7, "rgba(132,153,166,0.35)");
          rim.addColorStop(1, "rgba(80,104,119,0.52)");
          context.strokeStyle = rim;
          context.beginPath();
          context.arc(centerX, centerY, radius - context.lineWidth, 0, Math.PI * 2);
          context.stroke();
          context.restore();

          context.save();
          context.globalCompositeOperation = "screen";
          context.strokeStyle = "rgba(255,255,255,0.78)";
          context.lineCap = "round";
          context.lineWidth = radius * 0.027;
          context.shadowColor = "rgba(255,255,255,0.78)";
          context.shadowBlur = radius * 0.07;
          context.beginPath();
          context.arc(
            centerX,
            centerY,
            radius * 0.885,
            Math.PI * 1.03,
            Math.PI * 1.36
          );
          context.stroke();
          context.restore();

          context.save();
          context.globalCompositeOperation = "screen";
          fillRadialGlow(
            centerX - radius * 0.31,
            centerY - radius * 0.43,
            radius * 0.095,
            "rgba(255,255,255,0.92)"
          );
          fillRadialGlow(
            centerX - radius * 0.18,
            centerY - radius * 0.58,
            radius * 0.035,
            "rgba(255,255,255,0.9)"
          );
          context.restore();
        }

        function paint(time = 0) {
          const shortestSide = Math.min(viewportWidth, viewportHeight);
          const radius = clamp(shortestSide * 0.205, 86, 230);
          const baseCenterX = viewportWidth * 0.5;
          const baseCenterY = clamp(viewportHeight / 3, radius * 1.28, viewportHeight - radius * 1.3);
          const wander = getWanderOffset(time, radius);
          const centerX = baseCenterX + wander.x;
          const centerY = baseCenterY + wander.y;
          const groundY = viewportHeight * 0.765;
          const shadowCenterX = baseCenterX + wander.x * 0.38;
          const shadowCenterY = groundY - radius * 0.94;

          context.setTransform(1, 0, 0, 1, 0, 0);
          context.clearRect(0, 0, canvas.width, canvas.height);
          context.setTransform(canvas.width / viewportWidth, 0, 0, canvas.height / viewportHeight, 0, 0);

          drawBackground(time);
          drawShadow(shadowCenterX, shadowCenterY, radius, time);
          drawCubeCluster(baseCenterX, baseCenterY, radius, groundY, time);
          drawOrb(centerX, centerY, radius, time);

          document.body.classList.add("is-rendered");
        }

        function resize() {
          viewportWidth = Math.max(1, window.innerWidth);
          viewportHeight = Math.max(1, window.innerHeight);
          const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.round(viewportWidth * pixelRatio);
          canvas.height = Math.round(viewportHeight * pixelRatio);
          paint(performance.now());
        }

        function animate(time) {
          if (time - lastPaint >= 1000 / 30) {
            paint(time);
            lastPaint = time;
          }
          animationFrame = window.requestAnimationFrame(animate);
        }

        function startAnimation() {
          window.cancelAnimationFrame(animationFrame);
          if (reducedMotion || document.hidden) {
            paint(performance.now());
            return;
          }
          lastPaint = -Infinity;
          animationFrame = window.requestAnimationFrame(animate);
        }

        function handleMotionChange(event) {
          reducedMotion = event.matches;
          startAnimation();
        }

        function handleVisibilityChange() {
          startAnimation();
        }

        window.addEventListener("resize", resize, { passive: true });
        document.addEventListener("visibilitychange", handleVisibilityChange);
        if (typeof motionQuery.addEventListener === "function") {
          motionQuery.addEventListener("change", handleMotionChange);
        } else {
          motionQuery.addListener(handleMotionChange);
        }

        resize();
        startAnimation();
      })();
    </script>
  </body>
</html>
