name: Release verification

on:
  workflow_dispatch:
    inputs:
      run_consensus_drill:
        description: Run the Docker-backed four-validator CometBFT drill
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-artifact:
    name: Reproducible package verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Verify locked dependencies
        run: uv sync --all-extras --frozen
      - name: Run hermetic release regression suite
        run: uv run pytest -q -m "not integration" --disable-warnings --cov-fail-under=70
      - name: Build distributions
        run: uv build
      - name: Verify isolated wheel installation
        run: |
          python -m venv /tmp/aidn-release-verify
          /tmp/aidn-release-verify/bin/pip install dist/*.whl
          cd /tmp
          /tmp/aidn-release-verify/bin/python -c 'from aidn_hypervisor.main import build_app; assert build_app().title == "AiDN Hypervisor"'
      - name: Emit immutable artifact digests
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  consensus-drill:
    name: Four-validator CometBFT drill
    if: inputs.run_consensus_drill
    needs: release-artifact
    runs-on: ubuntu-latest
    env:
      AIDN_VALIDATOR_COUNT: "4"
      AIDN_COMETBFT_IMAGE: cometbft/cometbft:v0.38.19
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install verifier dependencies
        run: uv sync --all-extras --frozen
      - name: Start and verify isolated validator network
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/aidn-cometbft-evidence"
          chmod +x tools/run-cometbft-multivalidator-devnet.sh
          tools/run-cometbft-multivalidator-devnet.sh "${RUNNER_TEMP}/aidn-cometbft-state"
          uv run python tools/verify-cometbft-multivalidator-devnet.py \
            --output "${RUNNER_TEMP}/aidn-cometbft-evidence/consensus-drill.json" \
            --validator-rpc-url http://127.0.0.1:26658 \
            --validator-rpc-url http://127.0.0.1:26659 \
            --validator-rpc-url http://127.0.0.1:26660 \
            | tee "${RUNNER_TEMP}/aidn-cometbft-evidence/consensus-drill.stdout.json"
      - name: Upload consensus drill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consensus-drill-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/aidn-cometbft-evidence/
          if-no-files-found: warn
      - name: Preserve validator diagnostics on failure
        if: failure()
        run: |
          docker ps -a
          for i in 0 1 2 3; do
            docker logs "aidn-comet-$i" --tail 160 || true
            docker logs "aidn-abci-$i" --tail 160 || true
          done
      - name: Clean up isolated validator network
        if: always()
        run: |
          for i in 0 1 2 3; do docker rm -f "aidn-comet-$i" "aidn-abci-$i" || true; done
          docker network rm aidn-cometbft-devnet || true
