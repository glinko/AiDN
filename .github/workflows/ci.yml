name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_provider:
        description: Real provider profile to run on a self-hosted runner
        required: true
        default: none
        type: choice
        options:
          - none
          - llamacpp
          - vllm
          - ollama
      live_endpoint:
        description: Credential-free endpoint URL reachable from the runner
        required: false
        type: string
      live_model:
        description: Provider model identifier
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install development dependencies
        run: uv sync --all-extras --frozen
      - name: Run Ruff
        run: >-
          uv run ruff check --output-format=github
          --extend-exclude src/aidn_hypervisor/registry/__init__.py
          src tests
      - name: Verify documentation catalog
        run: |
          uv run python tools/generate-docs-index.py
          git diff --exit-code -- docs/INDEX.md

  test:
    name: Hermetic test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install development dependencies
        run: uv sync --all-extras --frozen
      - name: Run non-integration tests
        run: uv run pytest -q -m "not integration" --disable-warnings --cov-fail-under=70

  operator-surfaces:
    name: Operator surfaces and installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.16.0"
      - name: Check Ubuntu shell entrypoints
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find tools -type f -name '*.sh' -print0)
      - name: Install Dashboard dependencies
        working-directory: web/operator-dashboard
        run: pnpm install --frozen-lockfile
      - name: Check and build Dashboard
        working-directory: web/operator-dashboard
        run: |
          pnpm lint
          pnpm build
      - name: Install Website dependencies
        working-directory: web/website
        run: pnpm install --frozen-lockfile
      - name: Check and build Website
        working-directory: web/website
        run: |
          pnpm lint
          pnpm build

  faucet:
    name: Faucet tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Faucet dependencies
        working-directory: services/aidn-faucet
        run: uv sync --frozen
      - name: Run Faucet tests
        working-directory: services/aidn-faucet
        run: uv run --with pytest --with httpx pytest -q -c pyproject.toml tests

  package:
    name: Build and install distribution
    runs-on: ubuntu-latest
    needs: [lint, test, operator-surfaces, faucet]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build source and wheel distributions
        run: uv build
      - name: Verify wheel installs outside the checkout
        run: |
          python -m venv /tmp/aidn-wheel-verify
          /tmp/aidn-wheel-verify/bin/pip install dist/*.whl
          cd /tmp
          /tmp/aidn-wheel-verify/bin/python -c 'from aidn_hypervisor.main import build_app; assert build_app().title == "AiDN Hypervisor"'
      - name: Record distribution digests
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: aidn-distribution-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  integration:
    name: Live ${{ inputs.live_provider }} conformance
    if: github.event_name == 'workflow_dispatch' && inputs.live_provider != 'none'
    runs-on: self-hosted
    env:
      AIDN_LLAMACPP_ENDPOINT: ${{ inputs.live_provider == 'llamacpp' && inputs.live_endpoint || '' }}
      AIDN_LLAMACPP_MODEL: ${{ inputs.live_provider == 'llamacpp' && inputs.live_model || '' }}
      AIDN_VLLM_ENDPOINT: ${{ inputs.live_provider == 'vllm' && inputs.live_endpoint || '' }}
      AIDN_VLLM_MODEL: ${{ inputs.live_provider == 'vllm' && inputs.live_model || '' }}
      AIDN_OLLAMA_ENDPOINT: ${{ inputs.live_provider == 'ollama' && inputs.live_endpoint || '' }}
      AIDN_OLLAMA_MODEL: ${{ inputs.live_provider == 'ollama' && inputs.live_model || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install development dependencies
        run: uv sync --all-extras --frozen
      - name: Run selected live-provider profile
        run: >-
          uv run python tools/run_live_provider_conformance.py
          --provider "${{ inputs.live_provider }}"
