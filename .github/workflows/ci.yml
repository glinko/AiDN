name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install development dependencies
        run: uv sync --all-extras --frozen
      - name: Run Ruff
        run: >-
          uv run ruff check --output-format=github
          --extend-exclude src/aidn_hypervisor/registry/__init__.py
          src tests

  test:
    name: Hermetic test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install development dependencies
        run: uv sync --all-extras --frozen
      - name: Run non-integration tests
        run: uv run pytest -q -m "not integration" --disable-warnings --cov-fail-under=70

  integration:
    name: Opt-in integration tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install development dependencies
        run: uv sync --all-extras --frozen
      - name: Run configured integration tests
        env:
          AIDN_RUN_INTEGRATION: "1"
        run: uv run pytest -q -m integration --disable-warnings
