[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidn-hypervisor"
version = "0.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43",
    "fastapi>=0.115",
    "pydantic>=2.8",
    "uvicorn>=0.30",
]

[project.scripts]
aidn-mcp-server = "aidn_hypervisor.mcp.server:main"
aidn-mcp-server-http = "aidn_hypervisor.mcp.remote:main_http"
aidn-operator = "aidn_hypervisor.operator_cli:main"

[tool.setuptools.package-data]
aidn_hypervisor = ["static/*.html", "static/react-dashboard/*", "static/react-dashboard/assets/*"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.9", "mypy>=1.14", "pytest-asyncio>=0.24", "packaging>=24"]
network = ["aioquic>=1.1.0"]

[tool.pytest.ini_options]
# Tests import the dashboard preview helper that intentionally lives at the
# repository root, in addition to the installable source package.
pythonpath = [".", "src"]
addopts = [
    "--import-mode=importlib",
    "--cov=src",
    "--cov-report=term-missing",
]
markers = [
    "integration: opt-in test against a real external provider",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "*/__init__.py",
    "*/stubs/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING",
    "from __future__ import annotations",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
ignore_missing_imports = true
